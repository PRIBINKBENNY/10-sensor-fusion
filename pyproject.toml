[project]
name = "sensor-fusion-ekf"
version = "0.1.0"
description = "EKF fusing IMU, wheel odometry and GPS with bias estimation, outlier gating and consistency tests."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pillow>=10"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
